name: Auto Generate Metadata

on:
  # Chạy tự động mỗi ngày lúc 0h UTC (7h sáng Việt Nam)
  schedule:
    - cron: '0 0 * * *'
  # Cho phép bấm chạy thủ công trên giao diện GitHub
  workflow_dispatch:
  # Chạy mỗi khi push code lên nhánh main
  push:
    branches:
      - main

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create credential files from GitHub Secrets
        run: |
          echo "${{ secrets.DRIVE_CREDENTIALS }}" > credentials.json
          echo "${{ secrets.YT_CLIENT_SECRET }}" > client_secret.json
          echo "${{ secrets.YT_TOKEN }}" > token.json

      - name: Run metadata generator script
        run: python generate_metadata.py

      - name: Clean up credential files
        if: always()
        run: |
          rm -f credentials.json client_secret.json token.json

      - name: Commit and push updated metadata.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add metadata.json
          git status
          git diff-index --quiet HEAD || git commit -m "bot: auto update metadata.json"
          git push