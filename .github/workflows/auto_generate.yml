name: Auto Generate Metadata

on:
  workflow_dispatch:
  repository_dispatch:
    types: [drive_updated, youtube_updated]

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:             # <-- THÊM ĐOẠN NÀY
      contents: write        # Cấp quyền Ghi cho Token của Action
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ... Các bước install dependencies và run generate_metadata.py giữ nguyên ...

      - name: Commit & Push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata.json
          git status
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update metadata.json via Webhook" && git push)