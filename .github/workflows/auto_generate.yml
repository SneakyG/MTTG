name: Auto Generate Metadata

on:
  workflow_dispatch: # Cho phép bấm chạy thủ công
  repository_dispatch: # Lắng nghe tín hiệu tự động từ Google Apps Script
    types: [drive_updated, youtube_updated]

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:             # <-- THÊM ĐOẠN NÀY
      contents: write        # Cấp quyền Ghi cho Token của Action
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create credential files
        run: |
          echo "${{ secrets.DRIVE_CREDENTIALS }}" | base64 -d > credentials.json || true
          echo "${{ secrets.YT_CLIENT_SECRET }}" | base64 -d > client_secret.json || true
          echo "${{ secrets.YT_TOKEN }}" | base64 -d > token.json || true

      - name: Run metadata generator
        run: python generate_metadata.py

      - name: Commit & Push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata.json
          git status
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update metadata.json via Webhook" && git push)
      - name: Create credential files
        run: |
          echo "${{ secrets.DRIVE_CREDENTIALS }}" | base64 -d > credentials.json