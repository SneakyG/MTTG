<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giang ❤️ Triều - Hành Trình Tình Yêu</title>
    <!-- Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- File CSS tùy chỉnh -->
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body class="bg-rose-50 text-gray-800 min-h-screen overflow-x-hidden font-sans">

    <!-- INTRO SCREEN CÓ AVATAR GIANG & TRIỀU -->
    <div id="intro-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center text-center p-4 transition-opacity duration-800">
        <!-- Cặp Avatar -->
        <div class="flex items-center justify-center gap-4 mb-6">
            <div class="relative">
                <img src="./static/uploads/avatar/TGiang.jpg" alt="Giang" class="w-20 h-20 md:w-24 md:h-24 rounded-full object-cover border-4 border-white shadow-lg">
                <span class="absolute -bottom-1 -right-1 bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">Giang</span>
            </div>
            
            <div class="text-3xl animate-bounce">💖</div>
            
            <div class="relative">
                <img src="./static/uploads/avatar/MTrieu.jpg" alt="Triều" class="w-20 h-20 md:w-24 md:h-24 rounded-full object-cover border-4 border-white shadow-lg">
                <span class="absolute -bottom-1 -right-1 bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">Triều</span>
            </div>
        </div>

        <h1 class="text-2xl md:text-3xl font-bold text-rose-600 mb-2">Hành Trình Yêu Thương</h1>
        <p class="text-gray-600 text-sm mb-8">Chạm vào trái tim để mở hành trình nhé ✨</p>

        <button id="heart-btn" class="focus:outline-none transition-transform active:scale-95">
            <div id="heart-icon" class="text-7xl md:text-8xl animate-heartbeat cursor-pointer">❤️</div>
        </button>
    </div>

    <!-- 2. TRANG HOME -->
    <div id="home-screen" class="hidden min-h-screen pb-16">
        <!-- Background Ảnh mờ mờ của 2 bạn -->
        <div class="home-bg-overlay">
            <div id="home-bg-container" class="home-bg-images">
                <!-- JavaScript sẽ tự động lấy ảnh từ metadata.json đổ vào đây -->
            </div>
        </div>

        <!-- KHU VỰC HEADER TỔNG (CONTAINER BANNER) -->
        <div class="max-w-4xl mx-auto px-4 pt-8 pb-4">
            <!-- Thẻ Card Trắng Mờ Sang Trọng -->
            <div class="bg-white/80 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-xl border border-rose-100/60 relative overflow-hidden">
                
                <!-- Họa tiết hoa/tim mờ trang trí góc card -->
                <div class="absolute -top-6 -right-6 text-6xl opacity-10 pointer-events-none">💖</div>
                <div class="absolute -bottom-6 -left-6 text-6xl opacity-10 pointer-events-none">🌸</div>

                <!-- Layout Dàn Ngang trên PC (Flex) -->
                <div class="flex flex-col md:flex-row items-center justify-between gap-6 md:gap-8 relative z-10">
                    
                    <!-- CỘT BÊN TRÁI: AVATAR & TÊN & LỜI CHÚC -->
                    <div class="flex flex-col items-center md:items-start text-center md:text-left">
                        
                        <!-- Cụm Avatar Đôi Lớn -->
                        <div class="flex items-center justify-center mb-3">
                            <!-- Avatar Giang -->
                            <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden border-4 border-white shadow-md ring-2 ring-rose-300 transform -rotate-6 hover:rotate-0 transition duration-300">
                                <img src="./static/uploads/avatar/TGiang.jpg" alt="Giang" class="w-full h-full object-cover">
                            </div>

                            <!-- Nền trắng viền hồng, icon nảy nhẹ -->
                            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-rose-500 text-xl shadow-md z-10 -mx-3 ring-4 ring-white animate-pulse border border-rose-200">
                                ❤️
                            </div>

                            <!-- Avatar Triều -->
                            <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden border-4 border-white shadow-md ring-2 ring-rose-300 transform rotate-6 hover:rotate-0 transition duration-300">
                                <img src="./static/uploads/avatar/MTrieu.jpg" alt="Triều" class="w-full h-full object-cover">
                            </div>
                        </div>

                        <!-- Tên & Ngày -->
                        <h1 class="text-2xl md:text-3xl font-extrabold text-rose-600 tracking-wide mt-1">
                            Giang <span class="text-rose-400">&</span> Triều
                        </h1>
                        <p class="text-xs md:text-sm text-rose-400 font-medium mt-1">
                            🗓️ Bên nhau chính thức từ: <span class="font-bold text-gray-600">30/08/2026</span>
                        </p>
                        <p class="text-xs italic text-gray-400 mt-2 max-w-xs">
                            "Cùng nhau đi qua ngàn mùa mưa nắng..."
                        </p>
                    </div>

                    <!-- DƯỜNG PHÂN CÁCH DỌC (Chỉ hiện trên PC) -->
                    <div class="hidden md:block w-[1px] h-32 bg-gradient-to-b from-transparent via-rose-200 to-transparent"></div>

                    <!-- CỘT BÊN PHẢI: ĐỒNG HỒ ĐẾM THỜI GIAN -->
                    <div class="flex flex-col items-center">
                        <span class="text-xs uppercase font-bold tracking-wider text-rose-400 mb-3">
                            ✨ Thời gian đã đồng hành ✨
                        </span>

                        <!-- Các ô đếm số -->
                        <div class="grid grid-cols-4 gap-2 md:gap-3">
                            <div class="bg-rose-50/80 border border-rose-200/60 rounded-2xl p-3 text-center min-w-[64px] md:min-w-[72px] shadow-sm">
                                <span id="days" class="block text-2xl md:text-3xl font-black text-rose-600">5</span>
                                <span class="text-[10px] md:text-xs font-semibold text-rose-400 uppercase">Ngày</span>
                            </div>

                            <div class="bg-rose-50/80 border border-rose-200/60 rounded-2xl p-3 text-center min-w-[64px] md:min-w-[72px] shadow-sm">
                                <span id="hours" class="block text-2xl md:text-3xl font-black text-rose-600">12</span>
                                <span class="text-[10px] md:text-xs font-semibold text-rose-400 uppercase">Giờ</span>
                            </div>

                            <div class="bg-rose-50/80 border border-rose-200/60 rounded-2xl p-3 text-center min-w-[64px] md:min-w-[72px] shadow-sm">
                                <span id="minutes" class="block text-2xl md:text-3xl font-black text-rose-600">1</span>
                                <span class="text-[10px] md:text-xs font-semibold text-rose-400 uppercase">Phút</span>
                            </div>

                            <div class="bg-rose-50/80 border border-rose-200/60 rounded-2xl p-3 text-center min-w-[64px] md:min-w-[72px] shadow-sm">
                                <span id="seconds" class="block text-2xl md:text-3xl font-black text-rose-600">3</span>
                                <span class="text-[10px] md:text-xs font-semibold text-rose-400 uppercase">Giây</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- 🗺️ SƠ ĐỒ TRẠNG THÁI HÀNH TRÌNH -->
        <section class="max-w-4xl mx-auto px-4 mt-8">
            <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-sm border border-rose-100">
                <h2 class="text-center text-lg font-bold text-rose-800 mb-6">Hành Trình Tình Yêu</h2>
                <div id="roadmap-container" class="flex items-center justify-between relative">
                    <!-- Sơ đồ sẽ được render động từ JS -->
                </div>
            </div>
        </section>

        <!-- 📸 KHU VỰC HIỂN THỊ KỶ NIỆM THEO TRẠNG THÁI DƯỢC CHỌN -->
        <main class="max-w-5xl mx-auto px-4 mt-10 space-y-8">
            <div class="flex items-center justify-between border-b border-rose-200 pb-3">
                <h3 id="current-stage-title" class="text-2xl font-bold text-rose-700">
                    <!-- Tên giai đoạn đang chọn -->
                </h3>
                <span id="media-count" class="text-sm bg-rose-100 text-rose-600 px-3 py-1 rounded-full font-medium"></span>
            </div>

            <div class="mt-8 bg-white/80 backdrop-blur-md rounded-3xl p-4 md:p-6 shadow-sm border border-rose-100">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">                   
                    <!-- BỘ LỌC MEDIA & NGÀY -->
                    <div class="flex flex-wrap items-center gap-3">
                        <!-- Filter Loại Media -->
                        <div class="inline-flex p-1 bg-rose-50 rounded-xl border border-rose-100" id="media-type-filter">
                            <button data-type="all" class="filter-btn active px-3 py-1.5 rounded-lg text-xs font-semibold transition">Tất cả</button>
                            <button data-type="image" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 transition">🖼️ Hình ảnh</button>
                            <button data-type="video" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 transition">🎬 Video</button>
                        </div>

                        <!-- Filter Chọn Ngày -->
                        <select id="date-filter" class="bg-white border border-rose-200 text-gray-700 text-xs rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-rose-400">
                            <option value="all">📅 Tất cả các ngày</option>
                        </select>
                    </div>
                </div>

                <!-- GALLERY CONTAINER -->
                <div id="stage-gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 min-h-[300px]"></div>

                <!-- PHÂN TRANG (PAGINATION) -->
                <div id="pagination-container" class="flex justify-center items-center gap-2 mt-6"></div>
            </div>
        </main>
    </div>

    <!-- Thẻ Audio ẩn để phát nhạc nền -->
    <audio id="bg-music" loop preload="auto">
        <source src="./static/audio/THẾ GIỚI CỦA ANH.mp3" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ phát âm thanh.
    </audio>
    
    <!-- Nút âm nhạc ẩn mặc định (hidden), cố định ở góc dưới màn hình -->
    <button id="music-toggle" 
            class="hidden fixed bottom-6 right-6 z-50 bg-white/80 backdrop-blur-md p-3.5 rounded-full shadow-xl border border-rose-200 text-2xl hover:scale-110 active:scale-95 transition-all duration-300">
        🎵
    </button>
    <!-- File JavaScript chính -->
    <script src="./static/js/main.js"></script>
    <script>
        // Gọi hàm tải dữ liệu ngay khi trang web vừa nạp xong
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadData === 'function') {
                loadData();
            }
        });
    </script>
</body>
</html>
